<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aaj ki chunauti</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        h5 {
            color: #fff;
            margin-top: 20px;
            opacity: 0.9;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes {
            background-color: #ff2f68;
            color: white;
            z-index: 2;
        }

        #yes:hover {
            transform: scale(1.1);
        }

        #no {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
            z-index: 2;
        }

        /* Celebration screen */
        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .celebration img {
            max-width: 80%;
            max-height: 70vh;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .celebration h2 {
            margin-top: 20px;
            color: white;
            font-size: 2.5rem;
        }

        /* Falling hearts / confetti */
        .heart {
            position: fixed;
            font-size: 24px;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<!-- Background music -->
<audio id="bg-music" loop preload="auto">
    <source src="xenogenesis.mp3" type="audio/mpeg">
</audio>


<!-- Main screen -->
<div class="container" id="main">
    <h1>Will YOU, Di-vi-ja, be my Valentine? </h1>

    <button id="yes">Yes :)</button>
    <button id="no">No :(</button>

    <h5>no seems a bit shy ;)</h5>
</div>

<!-- Celebration screen -->
<div class="container celebration" id="celebrate">
    <img src="Celebration.jpg" alt="Celebration">
    <h2>You love me this much? : )))))))))</h2>
</div>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const music = document.getElementById("bg-music");

    // No button runs away
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // YES CLICK → PLAY MAIN CLIP 💥
    yesBtn.addEventListener("click", () => {
        music.currentTime = 14;
        music.volume = 0.9;
        music.play();

        setTimeout(() => {
            document.getElementById("main").style.display = "none";
            document.getElementById("celebrate").style.display = "flex";
        }, 300);
    });
</script>


</body>
</html>
